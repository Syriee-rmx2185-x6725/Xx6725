name: Build X6725 recovery
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - uses: actions/checkout@v4
        with: { path: tree }
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 repo
      - name: Sync TWRP minimal manifest
        run: |
          mkdir ~/twrp && cd ~/twrp
          git config --global user.name ci && git config --global user.email ci@example.com
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags
      - name: Build vendor_boot
        run: |
          mkdir -p ~/twrp/device/infinix && cp -r $GITHUB_WORKSPACE/tree ~/twrp/device/infinix/X6725
          cd ~/twrp && source build/envsetup.sh
          lunch twrp_X6725-eng
          mka adbd vendorbootimage -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: X6725-recovery
          path: ~/twrp/out/target/product/X6725/*.img
